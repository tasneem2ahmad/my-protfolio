<section id="skills" class="content-section">
  <h2 class="centered-title">Technical skills</h2>
  <div class="skill-groups">
    <article class="skill-group" *ngFor="let group of skillGroups">
      <div class="skill-group-heading"><i class="bi {{ group.icon }}" aria-hidden="true"></i><h3>{{ group.title }}</h3></div>
      <div class="skill-tags"><span *ngFor="let item of group.items">{{ item }}</span></div>
    </article>
  </div>
</section>
